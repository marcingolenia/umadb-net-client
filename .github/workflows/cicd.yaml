name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write   # required for NuGet Trusted Publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # enable OIDC token for this job

    steps:
      - uses: actions/checkout@v2
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test
      - name: Pack Nuget
        run: dotnet pack UmaDb.Client/UmaDb.Client.csproj -c Release -o nuget

      # NuGet Trusted Publishing: exchange GitHub OIDC token for short-lived API key
      - name: NuGet login (OIDC → temp API key)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: marcingolenia

      - name: Push nuget
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet nuget push ./nuget/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate