name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write   # required for NuGet Trusted Publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # enable OIDC token for this job

    steps:
      - uses: actions/checkout@v2
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        id: test
        run: >
          dotnet test
          --logger "console;verbosity=normal"
          --blame-crash --blame-crash-dump-type mini
          --blame-hang-timeout 90s --blame-hang-dump-type none
      - name: F# test host crash log
        if: always() && steps.test.outcome != 'success'
        run: |
          f=Tests.Fsharp/bin/Debug/net10.0/unhandled-exceptions.log
          if [ -f "$f" ]; then tail -n 300 "$f"; else echo "no $f"; fi
      - name: UmaDB container logs
        if: always() && steps.test.outcome != 'success'
        run: |
          for c in umadb-fsharp umadb-tls-secure-fsharp umadb umadb-tls-secure; do
            echo "::group::docker logs $c"
            docker logs "$c" 2>&1 | tail -n 200 || true
            echo "::endgroup::"
          done
      - name: Pack NuGet
        run: |
          dotnet pack UmaDb.Client/UmaDb.Client.csproj -c Release -o nuget
          dotnet pack UmaDb.Fsharp/UmaDb.Fsharp.fsproj -c Release -o nuget

      # NuGet Trusted Publishing: exchange GitHub OIDC token for short-lived API key
      - name: NuGet login (OIDC → temp API key)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: marcingolenia

      - name: Push nuget
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet nuget push ./nuget/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate