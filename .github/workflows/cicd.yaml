name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write   # required for NuGet Trusted Publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # enable OIDC token for this job

    steps:
      - uses: actions/checkout@v2
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      # Default TLS on Linux uses OpenSSL + /etc/ssl/certs; .NET's CurrentUser\Root store does not apply.
      # Installing the test CA lets "withTls" (no withCaCert) succeed in CI, same as trusting the CA locally.
      - name: Trust test CA
        run: |
          sudo cp Tests.Fsharp/certs/ca.pem /usr/local/share/ca-certificates/umadb-test-ca.crt
          sudo update-ca-certificates
      - name: Test
        run: dotnet test
      - name: Pack NuGet
        run: |
          dotnet pack UmaDb.Client/UmaDb.Client.csproj -c Release -o nuget
          dotnet pack UmaDb.Fsharp/UmaDb.Fsharp.fsproj -c Release -o nuget

      # NuGet Trusted Publishing: exchange GitHub OIDC token for short-lived API key
      - name: NuGet login (OIDC → temp API key)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: marcingolenia

      - name: Push nuget
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet nuget push ./nuget/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate